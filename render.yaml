services:
  # ── Core API: auth, user, resume, projects, jobs, linkedin, admin, stats ──
  - type: web
    name: smartapply-core
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r core/requirements.txt
    startCommand: uvicorn core.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartapply-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # AI (projects/linkedin/resume-parse) + required by assert_secure_config
      - key: NVIDIA_API_KEY
        sync: false
      # Email OTP (auth) + required by assert_secure_config
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: smartapplyai1@gmail.com
      - key: BREVO_SENDER_NAME
        value: SmartApply
      # Job search (jobs → Adzuna primary, JSearch/RapidAPI fallback)
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      # Resume file storage (user/resume → Cloudflare R2)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        value: https://smartapplies.app

  # ── AI API: ai, interview, tailor ──
  - type: web
    name: smartapply-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r ai/requirements.txt
    startCommand: uvicorn ai.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        fromService:
          type: web
          name: smartapply-core
          envVarKey: MONGODB_URI
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartapply-redis
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: SECRET_KEY
        fromService:
          type: web
          name: smartapply-core
          envVarKey: SECRET_KEY
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: smartapplyai1@gmail.com
      - key: BREVO_SENDER_NAME
        value: SmartApply
      # Optional remote LaTeX render fallback (tailor)
      - key: LATEX_FALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        value: https://smartapplies.app

  # ── Tools API: resume_maker, cover_letter, code_execution, upload ──
  - type: web
    name: smartapply-tools
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r tools/requirements.txt
    startCommand: uvicorn tools.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        fromService:
          type: web
          name: smartapply-core
          envVarKey: MONGODB_URI
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartapply-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: smartapply-core
          envVarKey: SECRET_KEY
      # AI (resume_maker/cover_letter) + required by assert_secure_config
      - key: NVIDIA_API_KEY
        sync: false
      # Required by assert_secure_config
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: smartapplyai1@gmail.com
      - key: BREVO_SENDER_NAME
        value: SmartApply
      # Code execution sandbox (code_execution → Judge0 via RapidAPI)
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_HOST
        value: judge0-ce.p.rapidapi.com
      - key: JUDGE0_API_URL
        value: https://judge0-ce.p.rapidapi.com
      # File storage (upload/resume_maker → Cloudflare R2)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Optional remote LaTeX render fallback (resume_maker/cover_letter)
      - key: LATEX_FALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        value: https://smartapplies.app

  # ── Frontend: React + Vite static site ──
  - type: web
    name: smartapply-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CORE_API_BASE_URL
        fromService:
          type: web
          name: smartapply-core
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AI_API_BASE_URL
        fromService:
          type: web
          name: smartapply-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_TOOLS_API_BASE_URL
        fromService:
          type: web
          name: smartapply-tools
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartapply-core
          envVarKey: RENDER_EXTERNAL_URL

  - type: redis
    name: smartapply-redis
    ipAllowList: [] # Internal only
    plan: free
